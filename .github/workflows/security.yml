name: security

# Scansioni di sicurezza account-free:
# - secret scanning (gitleaks): blocca se trova segreti nei commit;
# - SAST (Semgrep, regole OWASP/CWE): carica i risultati nel tab Security,
#   non blocca la CI (rendere bloccante via branch protection se desiderato);
# - dependency audit (pnpm audit): report informativo, non blocca.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: "30 3 * * 1" # lunedi 03:30 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --config p/typescript \
            --sarif --output semgrep.sarif
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
